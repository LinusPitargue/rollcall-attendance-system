<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students | RollCall</title>
  </head>
  <body>
    <h1>Student Database</h1>

    <p>
      <a href="/">Back to Dashboard</a>
    </p>

    <table border="1" cellpadding="8">
      <thead>
        <tr>
          <th>Student Number</th>
          <th>Full Name</th>
          <th>Email</th>
        </tr>
      </thead>

      <tbody>
        {% for student in students %}
        <tr>
          <td>{{ student["student_number"] }}</td>
          <td>{{ student["full_name"] }}</td>
          <td>{{ student["email"] or "No email" }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3">No students have been added yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
