{% extends "base.html" %} {% block title %} Add Class Schedule | RollCall {%
endblock %} {% block content %}
<div class="page-header">
  <div>
    <p class="eyebrow">Schedule management</p>
    <h1>Add Class Schedule</h1>
  </div>

  <a class="button secondary" href="/classes"> Back to Classes </a>
</div>

<div class="form-card">
  {% if error %}
  <div class="error-message">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label for="subject_code"> Subject Code </label>

      <input
        type="text"
        id="subject_code"
        name="subject_code"
        value="{{ form_data.get('subject_code', '') }}"
        placeholder="Example: CS101"
        required
      />
    </div>

    <div class="form-group">
      <label for="subject_name"> Subject Name </label>

      <input
        type="text"
        id="subject_name"
        name="subject_name"
        value="{{ form_data.get('subject_name', '') }}"
        placeholder="Example: Programming 1"
        required
      />
    </div>

    <div class="form-group">
      <label for="section"> Section </label>

      <input
        type="text"
        id="section"
        name="section"
        value="{{ form_data.get('section', '') }}"
        placeholder="Example: BSCS 2A"
        required
      />
    </div>

    <div class="form-group">
      <label for="room"> Room </label>

      <input
        type="text"
        id="room"
        name="room"
        value="{{ form_data.get('room', '') }}"
        placeholder="Example: Laboratory 2"
      />
    </div>

    <div class="form-group">
      <label for="meeting_day"> Meeting Day </label>

      <select id="meeting_day" name="meeting_day" required>
        <option value="">Select a day</option>

        {% for day in [ "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
        "Saturday" ] %}
        <option value="{{ day }}">{{ day }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="start_time"> Start Time </label>

      <input
        type="time"
        id="start_time"
        name="start_time"
        value="{{ form_data.get('start_time', '') }}"
        required
      />
    </div>

    <div class="form-group">
      <label for="end_time"> End Time </label>

      <input
        type="time"
        id="end_time"
        name="end_time"
        value="{{ form_data.get('end_time', '') }}"
        required
      />
    </div>

    <button class="button" type="submit">Save Class Schedule</button>
  </form>
</div>
{% endblock %}
