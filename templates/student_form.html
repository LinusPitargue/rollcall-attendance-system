{% extends "base.html" %} {% block title %} {{ form_title }} | RollCall {%
endblock %} {% block content %}
<div class="page-header">
  <div>
    <p class="eyebrow">Student database</p>
    <h1>{{ form_title }}</h1>
  </div>

  <a class="button secondary" href="/students"> Back to Students </a>
</div>

<div class="form-card">
  {% if error %}
  <div class="error-message">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label for="student_number"> Student Number </label>

      <input
        type="text"
        id="student_number"
        name="student_number"
        value="{{ student['student_number'] if student else '' }}"
        required
      />
    </div>

    <div class="form-group">
      <label for="full_name"> Full Name </label>

      <input
        type="text"
        id="full_name"
        name="full_name"
        value="{{ student['full_name'] if student else '' }}"
        required
      />
    </div>

    <div class="form-group">
      <label for="email"> Email </label>

      <input
        type="email"
        id="email"
        name="email"
        value="{{ student['email'] if student else '' }}"
      />
    </div>

    <button class="button" type="submit">Save Student</button>
  </form>
</div>
{% endblock %}
