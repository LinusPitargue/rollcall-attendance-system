<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ form_title }} | RollCall</title>
  </head>
  <body>
    <h1>{{ form_title }}</h1>

    <p>
      <a href="/students">Back to Student Database</a>
    </p>

    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}

    <form method="post">
      <p>
        <label for="student_number">Student Number:</label><br />
        <input
          type="text"
          id="student_number"
          name="student_number"
          value="{{ student['student_number'] if student else '' }}"
          required
        />
      </p>

      <p>
        <label for="full_name">Full Name:</label><br />
        <input
          type="text"
          id="full_name"
          name="full_name"
          value="{{ student['full_name'] if student else '' }}"
          required
        />
      </p>

      <p>
        <label for="email">Email:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          value="{{ student['email'] if student else '' }}"
        />
      </p>

      <button type="submit">Save Student</button>
    </form>
  </body>
</html>
