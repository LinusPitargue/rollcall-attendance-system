{% extends "base.html" %}

{% block title %}
Edit Class Schedule | RollCall
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <p class="eyebrow">Schedule management</p>
        <h1>Edit Class Schedule</h1>
    </div>

    <a class="button secondary" href="/classes">
        Back to Classes
    </a>
</div>

<div class="form-card">
    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label for="subject_code">
                Subject Code
            </label>

            <input
                type="text"
                id="subject_code"
                name="subject_code"
                value="{{ form_data.get(
                    'subject_code',
                    class_item['subject_code']
                ) }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="subject_name">
                Subject Name
            </label>

            <input
                type="text"
                id="subject_name"
                name="subject_name"
                value="{{ form_data.get(
                    'subject_name',
                    class_item['subject_name']
                ) }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="section">
                Section
            </label>

            <input
                type="text"
                id="section"
                name="section"
                value="{{ form_data.get(
                    'section',
                    class_item['section']
                ) }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="room">
                Room
            </label>

            <input
                type="text"
                id="room"
                name="room"
                value="{{ form_data.get(
                    'room',
                    class_item['room'] or ''
                ) }}"
            >
        </div>

        <div class="form-group">
            <label for="meeting_day">
                Meeting Day
            </label>

            <select id="meeting_day" name="meeting_day" required>
                {% for day in [
                    "Monday",
                    "Tuesday",
                    "Wednesday",
                    "Thursday",
                    "Friday",
                    "Saturday"
                ] %}
                    <option
                        value="{{ day }}"
                        {% if form_data.get(
                            'meeting_day',
                            class_item['meeting_day']
                        ) == day %}
                            selected
                        {% endif %}
                    >
                        {{ day }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="start_time">
                Start Time
            </label>

            <input
                type="time"
                id="start_time"
                name="start_time"
                value="{{ form_data.get(
                    'start_time',
                    class_item['start_time']
                ) }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="end_time">
                End Time
            </label>

            <input
                type="time"
                id="end_time"
                name="end_time"
                value="{{ form_data.get(
                    'end_time',
                    class_item['end_time']
                ) }}"
                required
            >
        </div>

        <button class="button" type="submit">
            Update Class Schedule
        </button>
    </form>
</div>
{% endblock %}
